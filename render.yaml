services:
  - type: web
    name: vias-seguras-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: OFFICIAL_INVITE_CODE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://vias-seguras-api.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: WORKERS
        value: "1"
      - key: CITY_LAT
        value: "1.2136"
      - key: CITY_LNG
        value: "-77.2811"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
