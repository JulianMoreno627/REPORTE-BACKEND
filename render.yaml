databases:
  - name: vias-seguras-db
    databaseName: vias_seguras
    user: vias
    plan: free
    region: oregon

services:
  - type: web
    name: vias-seguras-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vias-seguras-db
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: OFFICIAL_INVITE_CODE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://vias-seguras-api.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: WORKERS
        value: "1"
      - key: CITY_LAT
        value: "4.6097"
      - key: CITY_LNG
        value: "-74.0817"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
